D%22M34%2040L36%2047%22%20stroke%3D%22%237d92e6%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M29%202L19%2015H25L21%2024L33%2010H27L31%202Z%22%20fill%3D%22%23e5484d%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.2%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<title>Migraine Assistant</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#1d2733;--mu:#6b7785;--ln:#dde2e9;--ac:#4a5ba8;--ac2:#e5e9f7;--on:#fff;--sh:0 1px 2px rgba(20,30,50,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141a;--card:#1a1f29;--tx:#dfe4ec;--mu:#8d97a6;--ln:#2a313d;--ac:#8ea3ee;--ac2:#252c44;--on:#11141a;--sh:none}}
:root[data-theme="dark"]{--bg:#11141a;--card:#1a1f29;--tx:#dfe4ec;--mu:#8d97a6;--ln:#2a313d;--ac:#8ea3ee;--ac2:#252c44;--on:#11141a;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 112px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:0}
h3{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.sub{color:var(--mu);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:19px}
.i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ac2);color:var(--ac);font-size:13px;font-weight:700;font-style:italic;margin-left:6px;cursor:pointer;vertical-align:middle}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.big{width:100%;padding:24px 16px;border-radius:26px;background:var(--ac);color:var(--on);font-size:22px;font-weight:700;margin:6px 0 10px;box-shadow:0 8px 22px -8px var(--ac)}
.big small{display:block;font-size:14px;font-weight:500;opacity:.85}
.big.pre{padding:16px;font-size:18px;background:var(--ac2);color:var(--ac);box-shadow:none}
.rel{display:flex;align-items:center;gap:10px}.rel .big,.rel .btn{flex:1;width:auto;min-width:0}.rel .i{position:static;flex:none;margin:0;width:32px;height:32px;font-size:16px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{text-align:center}.stat b{display:block;font-size:28px;line-height:1.1}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.item:first-of-type{border-top:0}
.dot{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;color:#10151c}
.item .t{flex:1;min-width:0}.item .t div:first-child{font-weight:600}
.item .t div+div{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{color:var(--mu);font-size:18px;padding:6px 10px}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--ac);color:var(--on);font-weight:700;font-size:17px}
.btn.alt{background:var(--ac2);color:var(--ac)}.btn:disabled{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;margin:6px 3px;padding:7px 0 5px;font-size:12px;color:var(--mu);border:1.5px solid transparent;border-radius:14px;transition:background .15s,border-color .15s}
nav button svg{display:block;width:25px;height:25px;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:var(--ac);font-weight:700;border-color:var(--ac);background:var(--ac2)}
.v{display:none}.v.on{display:block}
#ov,#tip{position:fixed;inset:0;background:rgba(5,8,14,.55);display:none;z-index:10;align-items:flex-end;justify-content:center}
#tip{z-index:20;align-items:center;padding:24px}
#ov.on,#tip.on{display:flex}
.tb{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;font-size:15px}
.tb .btn{margin-top:14px}
#sh{background:var(--bg);width:100%;max-width:520px;max-height:93%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){#sh{animation:none}}
.gr{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--ln);font-size:15px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.chip.s2{border-color:#c9822b;color:#c9822b;background:rgba(201,130,43,.12)}.chip.s3{border-color:var(--mu);color:var(--mu)}
.ints{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.int{height:50px;border-radius:14px;font-size:19px;font-weight:700;color:#10151c;opacity:.45;border:3px solid transparent}
.int.on{opacity:1;border-color:var(--tx);transform:scale(1.05)}
input[type=time],input[type=datetime-local],input[type=text],input[type=number],input[type=date],textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--ln);border-radius:14px;padding:12px}
textarea{min-height:64px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar .n{width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:10px;background:var(--ac2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ac)}.bar .p{width:34px;text-align:right;color:var(--mu)}
.fl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--ln);gap:8px}
.fl:first-child{border-top:0}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:50%;background:var(--ac2);color:var(--ac);font-size:22px;font-weight:700}
.step b{min-width:70px;text-align:center}
.empty{color:var(--mu);text-align:center;padding:16px 6px}
.hint{color:#c0392b;font-size:14px;margin:8px 0 0;display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-top:1px solid var(--ln);text-align:right}td:first-child,th:first-child{text-align:left}th{font-weight:600;color:var(--mu)}
#aiout{white-space:pre-wrap;font-size:15px;margin-top:12px}
.sm{font-size:13px;color:var(--mu)}.rp td,.rp th{text-align:left;vertical-align:top;font-size:13px}.rp table{display:block;overflow-x:auto}.rp pre{white-space:pre-wrap;font:inherit;font-size:15px}
.ver{text-align:center;color:var(--mu);font-size:12px;margin:22px 0 4px;opacity:.85}
.mo{margin-bottom:10px;background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.mo>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:3px 8px;padding:12px 14px;align-items:center}
.mo>summary::-webkit-details-marker{display:none}
.mo>summary:after{content:"›";grid-row:1/4;grid-column:2;font-size:24px;color:var(--mu);transform:rotate(90deg);transition:transform .2s}
.mo[open]>summary:after{transform:rotate(-90deg)}
.mo .mn{font-weight:700;text-transform:capitalize}.mo .ms{grid-column:1;font-size:13px;color:var(--mu)}
.mo .dots{grid-column:1;display:flex;gap:3px;margin-top:2px;min-height:9px}.mo .dots i{width:9px;height:9px;border-radius:50%;display:block}
.mo .item{padding:10px 14px;border-top:1px solid var(--ln)}
.wk{padding:6px 14px;font-size:11.5px;font-weight:700;color:var(--mu);background:rgba(128,128,128,.09);text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--ln)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
.lnk{color:var(--ac);text-decoration:underline;font-size:inherit;padding:2px}
.wp{display:flex;gap:5px;margin:8px 0 4px}.wp i{flex:1;height:5px;border-radius:3px;background:var(--ln)}.wp i.d{background:var(--ac);opacity:.5}.wp i.on{background:var(--ac)}
.wc{font-size:12.5px;color:var(--mu);margin-bottom:2px}
.wq{font-size:22px;font-weight:700;margin:4px 0 10px;line-height:1.25}
.wh{font-size:15px;margin:16px 0 8px;color:var(--tx)}
.opt .chip{padding:13px 16px;font-size:16px}.chip.more{background:transparent;border-style:dashed;color:var(--mu)}
.wnav{position:sticky;bottom:0;display:flex;gap:10px;margin:20px -16px 0;padding:12px 16px 6px;background:linear-gradient(to top,var(--bg) 78%,transparent)}.wnav .btn{flex:1}
.pill{padding:6px 12px;border-radius:999px;background:var(--ac2);color:var(--ac);font-size:14px;font-weight:600}
.vr{padding:9px 0;border-top:1px solid var(--ln)}.vr:first-child{border-top:0}.vl{font-size:11.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.zs .zr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--ln)}.zs .zr:first-child{border-top:0}
.seg{display:flex;border:1.5px solid var(--ln);border-radius:12px;overflow:hidden;flex:none}.seg button{padding:10px 13px;font-size:14px;background:var(--card)}.seg button.on{background:var(--ac);color:var(--on);font-weight:700}
.mts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mt{border-radius:16px;padding:12px 4px;text-align:center;border:1.5px solid var(--ln);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:2px}
.mt svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mt b{font-size:15px}.mt small{font-size:11.5px;color:var(--mu);line-height:1.2}
.mt.now{background:var(--ac);color:var(--on);border-color:var(--ac);box-shadow:0 8px 18px -8px var(--ac);transform:scale(1.05)}.mt.now small{color:var(--on);font-weight:700;opacity:.95}
.mt.done{background:rgba(47,158,107,.14);border-color:#2f9e6b;color:#2f9e6b}.mt.done small{color:#2f9e6b;font-weight:700}
.mt.miss{border-style:dashed;border-color:#d9892b}.mt.miss small{color:#c77a1d}.mt.later{opacity:.6}

/* v3.1 */
.evs{display:flex;gap:14px;align-items:center;margin:12px 0 6px}.evs b{font-size:30px;line-height:1;display:block}.evs span{font-size:12px;color:var(--mu)}.evt{font-weight:700;font-size:14px}
.evr{font-size:14px;margin:6px 0 2px;min-height:21px}.evh{font-size:12.5px;color:var(--mu);font-weight:700;margin:10px 0 0}
svg.lc{width:100%;height:auto;display:block;touch-action:manipulation;overflow:visible}svg.lc text{font-size:10px;fill:var(--mu)}svg.lc text.v{fill:var(--tx);font-weight:700;font-size:11px}
details.tv{margin-top:10px}details.tv summary{cursor:pointer;color:var(--ac);font-size:14px;padding:6px 0}
.rsb{padding:8px 0;border-top:1px solid var(--ln)}.rsb:first-child{border-top:0}.seg2{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin:6px 0}.seg2 i{display:block;min-width:4px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.card.need{border:2px solid #d9892b}.rsg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rsbtn{padding:12px 8px;border-radius:14px;border:2px solid var(--ln);background:var(--card);font-size:15px;color:var(--tx);display:flex;gap:6px;align-items:center;justify-content:center}.rsbtn i{font-style:normal}
.rsbtn.on{border-color:var(--c);background:var(--c);color:#fff;font-weight:700}
@media print{
 @page{margin:14mm}
 body.rpt{background:#fff!important;color:#000!important}
 body.rpt{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--ln:#bbb}
 body.rpt #app,body.rpt .wrap,body.rpt header,body.rpt nav,body.rpt .v,body.rpt .ver,body.rpt .rpb,body.rpt .ib,body.rpt .gr,body.rpt #tip,body.rpt .sh-h .ib,body.rpt .row{display:none!important}
 body.rpt #ov{position:static!important;display:block!important;background:none!important;overflow:visible!important;height:auto!important}
 body.rpt #sh{position:static!important;max-height:none!important;height:auto!important;overflow:visible!important;box-shadow:none!important;border-radius:0!important;padding:0!important;width:auto!important;max-width:none!important;transform:none!important;background:#fff!important}
 body.rpt .rp table{display:table!important;width:100%;border-collapse:collapse}
 body.rpt .rp th,body.rpt .rp td{border:1px solid #bbb;padding:4px 6px;font-size:11pt}
 body.rpt .rp h3{break-after:avoid}body.rpt .rp tr,body.rpt .an,body.rpt .pl{break-inside:avoid}
 body.rpt *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none!important}
}
</style>

let CW=12,CSEL=null;
function weekSeries(n){const cur=wkKey(iso(new Date())),out=[];
 for(let i=n-1;i>=0;i--){const d=new Date(cur+"T12:00");d.setDate(d.getDate()-7*i);out.push({k:iso(d).slice(0,10),n:0,s:0})}
 const m={};out.forEach(o=>m[o.k]=o);S.attacks.forEach(a=>{const o=m[wkKey(a.date)];if(o){o.n++;o.s+=a.intensity}});
 out.forEach((o,i)=>{o.avg=o.n?o.s/o.n:null;o.cur=i===n-1});return out}
const wlab=k=>new Date(k+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}),wshort=k=>{const d=new Date(k+"T12:00");return d.getDate()+"/"+(d.getMonth()+1)};
function lineSVG(ser,sel,key,color,label){
 const W=340,H=140,L=24,R=12,T=18,B=22,n=ser.length,pw=W-L-R,ph=H-T-B,val=o=>key==="n"?o.n:o.avg,vs=ser.map(val).filter(v=>v!=null);
 let mx,ticks=[];if(key==="n"){const m=Math.max(2,...vs),st=m<=4?1:m<=8?2:m<=20?5:10;mx=Math.ceil(m/st)*st;for(let t=0;t<=mx;t+=st)ticks.push(t)}else{mx=10;ticks=[0,5,10]}
 const X=i=>L+(n>1?i*pw/(n-1):pw/2),Y=v=>T+ph-v/mx*ph,kx=n<=8?1:n<=14?2:n<=20?3:4;
 const grid=ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--ln)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+3.5}" text-anchor="end">${t}</text>`).join("");
 const xl=ser.map((o,i)=>(n-1-i)%kx===0?`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${wshort(o.k)}</text>`:"").join("");
 let lines="",run=[];const flush=()=>{if(run.length>1)lines+=`<polyline points="${run.map(([i,v])=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;run=[]};
 ser.forEach((o,i)=>{const v=val(o);if(i<n-1&&v!=null)run.push([i,v]);else flush()});flush();
 const pv=n>1?val(ser[n-2]):null,lv2=val(ser[n-1]);
 if(n>1&&pv!=null&&lv2!=null)lines+=`<line x1="${X(n-2).toFixed(1)}" y1="${Y(pv).toFixed(1)}" x2="${X(n-1).toFixed(1)}" y2="${Y(lv2).toFixed(1)}" stroke="${color}" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>`;
 let area="";if(key==="n"&&n>1)area=`<path d="M${X(0).toFixed(1)},${Y(0)} ${ser.map((o,i)=>"L"+X(i).toFixed(1)+","+Y(o.n).toFixed(1)).join(" ")} L${X(n-1).toFixed(1)},${Y(0)}Z" fill="${color}" opacity=".12"/>`;
 const dots=ser.map((o,i)=>{const v=val(o);if(v==null)return"";const cur=o.cur,s=i===sel;
  return `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${s?6:4}" fill="${cur?"var(--card)":color}" stroke="${cur?color:"var(--card)"}" stroke-width="2"/>`}).join("");
 let cross="",lab="";if(sel!=null&&ser[sel]){const v=val(ser[sel]);cross=`<line x1="${X(sel).toFixed(1)}" x2="${X(sel).toFixed(1)}" y1="${T-4}" y2="${T+ph}" stroke="var(--mu)" stroke-width="1" opacity=".55"/>`;
  if(v!=null)lab=`<text class="v" x="${Math.min(W-R-6,Math.max(L+6,X(sel))).toFixed(1)}" y="${Math.max(11,Y(v)-11).toFixed(1)}" text-anchor="middle">${key==="n"?v:fr(v)}</text>`}
 return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><title>${esc(label)}</title>${grid}${xl}${area}${cross}${lines}${dots}${lab}</svg>`}
function evoCharts(){const ser=weekSeries(CW),sel=CSEL==null||CSEL>=CW?CW-1:CSEL,o=ser[sel];
 const rd=`Semaine du <b>${wlab(o.k)}</b>${o.cur?" (en cours)":""} : <b>${o.n} crise${o.n>1?"s":""}</b>${o.n?" · intensité moyenne <b>"+fr(o.avg)+"/10</b>":""}`;
 return `<div class="evr" aria-live="polite">${rd}</div><div class="evh">Nombre de crises par semaine</div>${lineSVG(ser,sel,"n","var(--ac)","Nombre de crises par semaine sur "+CW+" semaines")}<div class="evh">Intensité moyenne des crises (sur 10)</div>${lineSVG(ser,sel,"a","#d9892b","Intensité moyenne par semaine sur "+CW+" semaines")}`}
function evoHTML(){
 const chips=`<div class="chips">${[[8,"8 sem."],[12,"12 sem."],[26,"6 mois"]].map(([v,l])=>`<button class="chip${CW===v?" on":""}" data-cw="${v}">${l}</button>`).join("")}</div>`;
 if(!S.attacks.length)return chips+`<div class="empty">Les courbes apparaîtront dès votre première crise.</div>`;
 const ser=weekSeries(CW),full=ser.slice(0,-1),mean=full.length?full.reduce((s,x)=>s+x.n,0)/full.length:0;let tr="";
 if(full.length>=4){const k=Math.min(4,full.length>>1),rec=full.slice(-k),pre=full.slice(-2*k,-k),dm=mn(rec.map(x=>x.n))-mn(pre.map(x=>x.n));

 const tab=tbl(["Semaine du","Crises","Intensité moy."],ser.slice().reverse().map(o=>[wlab(o.k)+(o.cur?" (en cours)":""),o.n,o.n?fr(o.avg)+"/10":"–"]));
 return chips+`<div class="evs"><div><b>${fr(mean)}</b><span>crises par semaine en moyenne</span></div><div class="evt">${tr}</div></div><div id="evoc">${evoCharts()}</div><details class="tv"><summary>Voir en tableau</summary>${tab}</details>`}
function evoPick(e){const s=e.target.closest&&e.target.closest("svg.lc");if(!s)return;const r=s.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*340,i=Math.max(0,Math.min(CW-1,Math.round((x-24)/(340-24-12)*(CW-1))));

$("#v-stats").addEventListener("click",e=>{const b=e.target.closest("[data-cw]");if(b){CW=+b.dataset.cw;CSEL=null;$("#evo").innerHTML=evoHTML();return}evoPick(e)});

 ${C("#1f8f5a","🔬","En bref",`<p>Le « rapport d’analyse IA » est calculé par un <b>moteur intégré à l’application</b>. Il relit ce que vous avez noté, repère ce qui <b>revient avant vos crises</b>, puis propose des pistes classées par priorité.</p><p>Ce n’est <b>pas un chatbot</b> ni un service en ligne : tout se calcule <b>sur votre téléphone</b>, sans Internet, sans clé et sans abonnement. À chaque ouverture, le calcul est refait avec vos données les plus récentes.</p>`)}
 ${C("#4a5ba8","📅","Sur quelle durée ?",`<p>Sur la <b>période choisie en haut de l’onglet Analyse</b> : 7, 14, <b>30 jours (par défaut)</b>, 90 jours, tout l’historique ou un nombre de jours de votre choix.</p><ul><li>Toutes les crises, pré-crises et saisies du journal de cette période sont lues. Celles d’avant ne comptent pas.</li><li>Pour la comparaison jour par jour, l’analyse regarde au maximum les 120 derniers jours de journal.</li><li>Plus la période est longue, plus les conclusions sont solides. Comptez <b>au moins 5 crises</b> et un journal rempli presque chaque jour.</li></ul>`)}
 ${C("#8250c8","📥","Ce qui est lu",`<ul><li><b>Vos crises</b> : date, intensité, durée, côté, type de douleur, symptômes, déclencheurs cochés, traitements (heure de prise et effet noté), notes.</li><li><b>Vos pré-crises</b> : signes annonciateurs, leur évolution heure par heure, douleurs associées.</li><li><b>Votre journal</b> : sommeil, eau, café, alcool, écrans, activité, stress, humeur, tension de la nuque, météo, règles (si le suivi est activé), repas décrits, éléments importants et notes.</li><li><b>Votre profil</b> : âge, sexe, traitement de fond, pour certaines alertes (par exemple aura et contraception) et pour masquer ce qui ne vous concerne pas. Votre prénom ne sert que dans l’en-tête.</li></ul>`)}
 ${C("#e0852d","🧮","Comment il raisonne, en 4 étapes",`<ul><li><b>1. Il compte</b> : combien de crises, quelle intensité, quelle durée, à quel moment de la journée.</li><li><b>2. Il compare</b> les <b>24 heures avant chaque crise</b> avec le reste du temps (sommeil, stress, humeur, nuque), et <b>la veille</b> d’une crise avec les autres veilles (eau, café, alcool, écrans, activité). Un écart n’est retenu que s’il est net et appuyé sur assez de saisies.</li><li><b>3. Il cherche des mots</b> dans vos repas, notes et éléments importants des 24 h avant les crises : fromage, chocolat, charcuterie, alcool, caféine, écrans, posture, repas sauté… et les compare aux jours sans crise.</li><li><b>4. Il rapproche le tout de repères médicaux</b> (classification internationale des céphalées) pour évoquer un type de migraine, repérer des alertes et construire un plan d’action.</li></ul>`)}
 ${C("#c9a227","🚦","Comment lire les niveaux de confiance",`<p>${tag("ok","élevée")} écart très net, vu sur au moins 6 saisies de chaque côté. ${tag("wn","moyenne")} écart net, sur au moins 4 saisies avant crise. ${tag("mu","faible")} écart modéré, sur au moins 3 saisies. En dessous, rien n’est affiché.</p><p>Pour les types de migraine, ${tag("ok","Évocateur")} veut dire que les critères sont réunis dans la majorité de vos crises, ${tag("wn","Possible")} dans une partie seulement.</p>`)}
 ${C("#d6504a","⚠️","Ce qu’il ne fait pas",`<ul><li>Il <b>ne pose pas de diagnostic</b> : seul un médecin le peut.</li><li>Il <b>ne prouve pas une cause</b> : « souvent avant la crise » ne veut pas dire « provoque la crise ».</li><li>Il ne voit que ce que vous notez : un journal rempli un jour sur deux donne des pistes fragiles.</li><li>Il ne remplace pas un avis médical, surtout si les crises changent, s’aggravent ou s’accompagnent de signes inhabituels.</li></ul>`)}
 ${C("#2f9e6b","🔒","Vos données",`<p>Tout reste <b>sur cet appareil</b> : rien n’est envoyé sur Internet pendant l’analyse. Les rapports sont archivés dans l’app (les 40 derniers). Vous décidez seul(e) de les imprimer, les enregistrer ou les partager.</p>`)}
 ${C("#1f9fb0","🛠️","Pour de meilleurs résultats",`<ul><li>Remplissez le journal <b>matin, midi et soir</b>.</li><li>Notez l’<b>heure de chaque traitement</b>, la <b>fin de la crise</b> et si le traitement a <b>fonctionné</b> (totalement, partiellement, rebond, sans effet).</li><li>Signalez vos <b>pré-crises</b> et cochez les <b>éléments importants</b> (3 h d’écran, mauvaise posture, repas sauté…).</li><li>Décrivez vos repas : l’analyse les lit.</li></ul>`)}
 <button class="btn" id="aix" style="margin-top:8px">🔬 Ouvrir le rapport d’analyse</button>`);
