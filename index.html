<title>Migraine Assistant</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#1d2733;--mu:#6b7785;--ln:#dde2e9;--ac:#4a5ba8;--ac2:#e5e9f7;--on:#fff;--sh:0 1px 2px rgba(20,30,50,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 112px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:19px}
.i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ac2);color:var(--ac);font-size:13px;font-weight:700;font-style:italic;margin-left:6px;cursor:pointer;vertical-align:middle}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.big{width:100%;padding:24px 16px;border-radius:26px;background:var(--ac);color:var(--on);font-size:22px;font-weight:700;margin:6px 0 10px;box-shadow:0 8px 22px -8px var(--ac)}
.big small{display:block;font-size:14px;font-weight:500;opacity:.85}
.big.pre{padding:16px;font-size:18px;background:var(--ac2);color:var(--ac);box-shadow:none}
.rel{display:flex;align-items:center;gap:10px}.rel .big,.rel .btn{flex:1;width:auto;min-width:0}.rel .i{position:static;flex:none;margin:0;width:32px;height:32px;font-size:16px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{text-align:center}.stat b{display:block;font-size:28px;line-height:1.1}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.item:first-of-type{border-top:0}
.dot{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;color:#10151c}
.item .t{flex:1;min-width:0}.item .t div:first-child{font-weight:600}
.item .t div+div{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{color:var(--mu);font-size:18px;padding:6px 10px}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--ac);color:var(--on);font-weight:700;font-size:17px}
.btn.alt{background:var(--ac2);color:var(--ac)}.btn:disabled{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;margin:6px 3px;padding:7px 0 5px;font-size:12px;color:var(--mu);border:1.5px solid transparent;border-radius:14px;transition:background .15s,border-color .15s}
nav button svg{display:block;width:25px;height:25px;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:var(--ac);font-weight:700;border-color:var(--ac);background:var(--ac2)}
.v{display:none}.v.on{display:block}
#ov,#tip{position:fixed;inset:0;background:rgba(5,8,14,.55);display:none;z-index:10;align-items:flex-end;justify-content:center}
#tip{z-index:20;align-items:center;padding:24px}
#ov.on,#tip.on{display:flex}
.tb{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;font-size:15px}
.tb .btn{margin-top:14px}
#sh{background:var(--bg);width:100%;max-width:520px;max-height:93%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){#sh{animation:none}}
.gr{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--ln);font-size:15px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.chip.s2{border-color:#c9822b;color:#c9822b;background:rgba(201,130,43,.12)}.chip.s3{border-color:var(--mu);color:var(--mu)}
.ints{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.int{height:50px;border-radius:14px;font-size:19px;font-weight:700;color:#10151c;opacity:.45;border:3px solid transparent}
.int.on{opacity:1;border-color:var(--tx);transform:scale(1.05)}
input[type=datetime-local],input[type=text],input[type=number],input[type=date],textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--ln);border-radius:14px;padding:12px}
textarea{min-height:64px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar .n{width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:10px;background:var(--ac2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ac)}.bar .p{width:34px;text-align:right;color:var(--mu)}
.fl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--ln);gap:8px}
.fl:first-child{border-top:0}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:50%;background:var(--ac2);color:var(--ac);font-size:22px;font-weight:700}
.step b{min-width:70px;text-align:center}
.empty{color:var(--mu);text-align:center;padding:16px 6px}
.hint{color:#c0392b;font-size:14px;margin:8px 0 0;display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-top:1px solid var(--ln);text-align:right}td:first-child,th:first-child{text-align:left}th{font-weight:600;color:var(--mu)}
#aiout{white-space:pre-wrap;font-size:15px;margin-top:12px}
.sm{font-size:13px;color:var(--mu)}.rp td,.rp th{text-align:left;vertical-align:top;font-size:13px}.rp table{display:block;overflow-x:auto}.rp pre{white-space:pre-wrap;font:inherit;font-size:15px}
.ver{text-align:center;color:var(--mu);font-size:12px;margin:22px 0 4px;opacity:.85}
.mo{margin-bottom:10px;background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.mo>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:3px 8px;padding:12px 14px;align-items:center}
.mo>summary::-webkit-details-marker{display:none}
.mo>summary:after{content:"›";grid-row:1/4;grid-column:2;font-size:24px;color:var(--mu);transform:rotate(90deg);transition:transform .2s}
.mo[open]>summary:after{transform:rotate(-90deg)}
.mo .mn{font-weight:700;text-transform:capitalize}.mo .ms{grid-column:1;font-size:13px;color:var(--mu)}
.mo .dots{grid-column:1;display:flex;gap:3px;margin-top:2px;min-height:9px}.mo .dots i{width:9px;height:9px;border-radius:50%;display:block}
.mo .item{padding:10px 14px;border-top:1px solid var(--ln)}
.wk{padding:6px 14px;font-size:11.5px;font-weight:700;color:var(--mu);background:rgba(128,128,128,.09);text-transform:uppercase;letter-spacing:.04em;border-top:1px solid var(--ln)}
</style>
</head>

<script>
const $=s=>document.querySelector(s);

const INFO={go:"Déclare une crise. Seule l’intensité est obligatoire : le reste est facultatif et peut être complété plus tard.",pre:"À utiliser dès les premiers signes (bâillements, nuque raide…) alors que la migraine n’est pas là. Ces signes seront automatiquement rattachés à la prochaine crise déclarée dans les 48 h.",jr:"Le journal collecte vos habitudes (sommeil, eau, stress…). Chaque saisie est horodatée avec précision. Vous pouvez en faire plusieurs par jour : c’est ce qui permet de repérer ce qui précède une crise.",hist:"Toutes vos crises, avec leurs signes de pré-crise rattachés. Touchez 🗑 pour supprimer.",stats:"Comptages simples : fréquence, intensité, éléments les plus souvent cochés.",ana:"Corrélations calculées sur votre appareil, puis analyse approfondie par IA sur demande.",when:"Date et heure de début. Par défaut : maintenant. Modifiable si vous déclarez après coup.",int:"Intensité de 1 (légère) à 10 (insupportable). Le vert correspond à une douleur faible, le rouge à une douleur forte.",loc:"Où la douleur est située. « Aucun » = aucune localisation précise ; « ＋ Autre » ajoute un élément mémorisé pour la prochaine fois.",sym:"Signes qui accompagnent la douleur. « Aucun » = aucun symptôme associé ; « ＋ Autre » ajoute un élément mémorisé.",pain:"Douleurs cervicales, mâchoire, œil, face… Touchez un élément pour choisir sa chronologie : « avant » (précède la migraine, possible déclencheur), « après » (conséquence), « incertain ». Touchez encore pour effacer. C’est ce qui permettra de savoir si ces douleurs causent la migraine ou en découlent.",trg:"Ce que vous soupçonnez d’avoir déclenché la crise. Cochez large : l’analyse départagera. « Aucun » = aucun déclencheur identifié.",trt:"Ce que vous avez pris ou fait pour soulager. « ＋ Autre » mémorise un nouveau traitement pour les prochaines fois.",lp:"Signes de pré-crise récents (48 h) non encore rattachés. Cochés = liés à cette crise ; décochez ceux qui n’ont aucun rapport.",note:"Texte libre : contexte, lieu, activité, évolution.",prep:"Symptômes ressentis AVANT la douleur. Les repérer permet d’anticiper et de traiter plus tôt. « Aucun » = rien de particulier.",ai:"Envoie vos données (sans votre nom) à Claude pour une analyse approfondie : déclencheurs probables, chronologie des douleurs, pistes de prévention. Aide à la réflexion, pas un diagnostic. L’envoi n’a lieu que lorsque vous touchez le bouton.",prof:"Âge, poids, taille, antécédents… ces éléments affinent l’analyse. Tout reste sur votre appareil.",lists:"Retirez (✕) ou ajoutez des éléments dans chaque questionnaire. Les ajouts faits dans une crise apparaissent aussi ici.",corr:"Compare vos moyennes dans les 24 h avant une crise avec celles des autres moments. Un écart marqué est une piste, pas une preuve.",chr:"Pour chaque zone douloureuse : combien de fois elle est apparue avant, après, ou avec chronologie incertaine par rapport à la migraine."};

const ACSS=`.an{--c:#4a5ba8;border-left:5px solid var(--c);background:rgba(128,128,128,.08);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px;line-height:1.45}
.an h4{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:9px;color:var(--c)}
.an h4 i{font-style:normal;display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:10px;background:var(--c);color:#fff;font-size:16px}
.an ul{margin:0;padding:0;list-style:none}.an li{position:relative;padding:7px 0 7px 18px;border-top:1px solid rgba(128,128,128,.2)}.an li:first-child{border-top:0}

.tg.ok{background:#2f9e6b}.tg.wn{background:#d9892b}.tg.mu{background:#8a94a3}.tg.bd{background:#d6504a}
.pl{border-radius:12px;padding:10px 12px;margin:9px 0;background:rgba(47,158,107,.1);border:1px solid rgba(47,158,107,.4)}
.pl .t{font-weight:700;display:flex;gap:9px;align-items:center}.pl .t b{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#1f8f5a;color:#fff;font-size:13px}
.pl .w,.pl .h{margin-top:5px;font-size:14px}.pl .w{opacity:.85}
.an .al{border-radius:12px;padding:10px 12px;margin:8px 0;background:rgba(214,80,74,.12);border:1px solid rgba(214,80,74,.45)}
.an .qs{border-radius:12px;padding:10px 12px;margin:8px 0;background:rgba(74,91,168,.1);border:1px solid rgba(74,91,168,.35)}
.an .qs ul{margin-top:4px}.an.top{border-left-width:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .an .tt{filter:brightness(1.5)}}:root[data-theme="dark"] .an .tt{filter:brightness(1.5)}`;
if(document.head)document.head.insertAdjacentHTML("beforeend","<style>"+ACSS+"</style>");
const SECI={1:["📊","#4a5ba8"],2:["🧬","#8250c8"],3:["⚡","#e0852d"],4:["🦴","#1f9fb0"],5:["🌀","#c9a227"],6:["💊","#2f9e6b"],7:["🍽️","#d6704a"],8:["✅","#1f8f5a"],9:["🗂️","#7b8794"],10:["🚨","#d6504a"]},
 SECT={1:"Profil des crises",2:"Types de migraine évoqués",3:"Déclencheurs probables",4:"Cervicales, mâchoire, œil, face",5:"Signes annonciateurs",6:"Traitements",7:"Alimentation et repas",8:"Plan d’action personnalisé",9:"Données manquantes",10:"Alertes et questions au médecin"};
const tag=(c,x)=>`<span class="tg ${c}">${x}</span>`;
function hl(s,n){let x=esc(s);
 if(n===2)x=x.replace(/^(.*?) — /,"<b>$1</b> — ");else if([1,3,4,5,6,7].includes(n))x=x.replace(/^([^:]{2,60}?) : /,"<b>$1</b> : ");
 return x.replace(/— (Évocateur)/,"— "+tag("ok","$1")).replace(/— (Possible)/,"— "+tag("wn","$1")).replace(/— (Peu typique avec les informations actuelles)/,"— "+tag("mu","$1"))
  .replace(/confiance (élevée)/,"confiance "+tag("ok","$1")).replace(/confiance (moyenne)/,"confiance "+tag("wn","$1")).replace(/confiance (faible)/,"confiance "+tag("mu","$1"))
  .replace("(sens attendu)",tag("ok","sens attendu")).replace("(sens inattendu : à prendre avec prudence)",tag("mu","sens inattendu : prudence"))
  .replace("signal plutôt fiable",tag("ok","signal fiable")).replace("souvent une fausse alerte",tag("mu","souvent une fausse alerte"))
  .replace(/plutôt (AVANT|APRÈS \/ pendant)/,m=>"<b>"+m+"</b>")}
function anaHTML(t){const secs=[],intro=[];let cur=null;
 t.split("\n").forEach(l=>{const m=l.match(/^▌ (\d+)\) /);if(m){cur={n:+m[1],L:[]};secs.push(cur)}else if(cur)cur.L.push(l);else if(l.trim())intro.push(l)});
 const plans=[];let out=intro.length?`<p class="nt" style="margin:8px 0">${intro.map(esc).join("<br>")}</p>`:"";
 let body="";
 secs.forEach(s=>{const[ic,c]=SECI[s.n]||["•","#4a5ba8"];let ul=[],h="",pl=null;const fl=()=>{if(ul.length){h+=`<ul>${ul.join("")}</ul>`;ul=[]}};
  s.L.forEach(l=>{if(!l.trim())return;let m;
   if(l.startsWith("• ")){ul.push(`<li>${hl(l.slice(2),s.n)}</li>`);return}
   if(l.startsWith("   – ")){ul.push(`<li class="sub">${esc(l.slice(5))}</li>`);return}
   if(s.n===8&&(m=l.match(/^(\d+)\. (.+)$/))){fl();pl={n:m[1],t:m[2].charAt(0)+m[2].slice(1).toLowerCase(),w:"",h:""};plans.push(pl);return}
   if(pl&&(m=l.match(/^ {3}Pourquoi : (.*)$/))){pl.w=m[1];return}
   if(pl&&(m=l.match(/^ {3}À faire : (.*)$/))){pl.h=m[1];return}
   fl();
   if(l.startsWith("Consultez en urgence si"))h+=`<div class="al"><b>🚑 Consultez en urgence si</b> ${esc(l.replace(/^Consultez en urgence si :?/,""))}</div>`;
   else if(l.startsWith("Questions à poser :"))h+=`<div class="qs"><b>💬 Questions pour votre médecin</b><ul>${l.slice(19).split(" · ").map(q=>`<li>${esc(q.trim())}</li>`).join("")}</ul></div>`;
   else if(l.startsWith("Cette analyse est"))h+=`<p class="nt">${esc(l)}</p>`;
   else h+=`<p class="${/^(Méthode|Compléments|Repères)/.test(l)?"nt":""}">${/^Méthode/.test(l)?"💡 ":/^Compléments/.test(l)?"🌿 ":""}${esc(l)}</p>`});
  fl();
  if(s.n===8)h=plans.map(p=>`<div class="pl"><div class="t"><b>${p.n}</b>${esc(p.t)}</div><div class="w">🎯 <b>Pourquoi :</b> ${esc(p.w)}</div><div class="h">🛠️ <b>À faire :</b> ${esc(p.h)}</div></div>`).join("")+h;
  body+=`<div class="an" style="--c:${c}"><h4><i>${ic}</i><span class="tt">${SECT[s.n]}</span></h4>${h}</div>`});
 const top=plans.slice(0,3);
 return out+(top.length?`<div class="an top" style="--c:#1f8f5a"><h4><i>🎯</i><span class="tt">À retenir en priorité</span></h4><ul>${top.map(p=>`<li><b>${esc(p.t)}</b></li>`).join("")}</ul></div>`:"")+body}
const ATYPE={s:["📄","#4a5ba8"],d:["📑","#8250c8"],a:["🤖","#1f8f5a"]};
function archive(ty,title,html){S.arch=S.arch||[];const l=S.arch[0];if(l&&l.ty===ty&&l.html===html)return;
 S.arch.unshift({id:Date.now(),d:new Date().toISOString(),ty,title,per:per(),html});let sz=0;S.arch=S.arch.filter((a,i)=>{sz+=a.html.length;return i<40&&sz<1.5e6});save()}
function openReport(ty,html,title,name){archive(ty,title,html);ana();showReport(html,title,name)}
function aiReport(){if(!S.attacks.length){dlg("Enregistrez au moins une crise avant de lancer l’analyse.");return}
 sheet(`<div class="sh-h"><h2>Rapport d’analyse</h2><button class="ib" id="x">✕</button></div><div class="an" style="--c:#1f8f5a"><h4><i>🔬</i>Analyse en cours…</h4><p class="nt">Lecture de vos crises, du journal, des repas et des éléments importants notés.</p></div>`);$("#x").onclick=close;
 setTimeout(()=>{if(!$("#ov").classList.contains("on"))return;let t;try{t=expertText()}catch(e){sheet(`<div class="sh-h"><h2>Analyse impossible</h2><button class="ib" id="x">✕</button></div><p>${esc(e.message||e)}</p>`);$("#x").onclick=close;return}
  openReport("a",head("Rapport d’analyse")+anaHTML(t),"Rapport d’analyse","rapport-analyse")},450)}
let AALL=false;
function ana(){const pp=[7,14,30,90,0],ar=S.arch||[],shown=AALL?ar:ar.slice(0,5);
 $("#v-ana").innerHTML=`<h3 style="margin-top:0">Période${I("per")}</h3><div class="chips">${pp.map(d=>`<button class="chip${per()===d?" on":""}" data-per="${d}">${d?d+" jours":"Tout"}</button>`).join("")}${pp.includes(per())?"":`<button class="chip on">${per()} jours</button>`}<button class="chip" data-per="x">Autre…</button></div>
 <h3>Rapports${I("rap")}</h3><div class="card"><button class="btn" id="r1">📄 Rapport</button><button class="btn alt" id="r2" style="margin-top:10px">📑 Rapport détaillé</button><div class="rel" style="margin-top:10px"><button class="btn alt" id="r3">🤖 Rapport d’analyse</button>${I("ai")}</div><div class="sm" style="margin-top:8px">Le rapport d’analyse est refait à chaque ouverture, avec vos dernières données. Chaque rapport est archivé ci-dessous.</div></div>
 <h3>Comparaison avant crise${I("corr")}</h3><div class="card">${corr()}</div>
 <h3>Archives des rapports${I("arch")}</h3><div class="card">${ar.length?shown.map(a=>{const t=ATYPE[a.ty]||ATYPE.s;return `<div class="item" data-ar="${a.id}"><div class="dot" style="background:${t[1]};color:#fff">${t[0]}</div><div class="t"><div>${esc(a.title)}</div><div>${fmt(a.d)} · ${a.per?a.per+" jours":"tout l’historique"}</div></div><button class="del" data-dar="${a.id}" aria-label="Supprimer">🗑</button></div>`}).join("")+(ar.length>5?`<button class="btn alt" id="arall" style="margin-top:10px">${AALL?"Réduire":"Tout afficher ("+ar.length+")"}</button>`:""):`<div class="empty">Vos rapports seront archivés ici automatiquement.</div>`}</div>`;
 $("#r1").onclick=()=>openReport("s",rapport(0),"Rapport","rapport-migraine");$("#r2").onclick=()=>openReport("d",rapport(1),"Rapport détaillé","rapport-detaille");$("#r3").onclick=aiReport;
 document.querySelectorAll("[data-ar]").forEach(b=>b.onclick=e=>{if(e.target.closest(".del"))return;const a=(S.arch||[]).find(x=>x.id==b.dataset.ar);if(a)showReport(`<p class="sm">📁 Archive du ${fmt(a.d)}</p>`+a.html,a.title,"archive-"+a.ty+"-"+a.id)});
 document.querySelectorAll("[data-dar]").forEach(b=>b.onclick=()=>sure("Supprimer ce rapport de l’archive ?",()=>{S.arch=S.arch.filter(x=>x.id!=b.dataset.dar);save();ana()}));
 if($("#arall"))$("#arall").onclick=()=>{AALL=!AALL;ana()};
 document.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{if(b.dataset.per==="x")ask("Nombre de jours à prendre en compte :",v=>{const n=parseInt(v);if(n>0){S.per=n;save();ana()}});else{S.per=+b.dataset.per;save();ana()}})}
/* ---------- v7 : historique rangé par mois ---------- */
let HF="all";const HOpen={};
const wkKey=d=>{const x=new Date(d.slice(0,10)+"T12:00");x.setDate(x.getDate()-(x.getDay()+6)%7);return iso(x).slice(0,10)};
function weeks(it){const g={};it.forEach(x=>(g[wkKey(x.d)]=g[wkKey(x.d)]||[]).push(x));
 return Object.keys(g).sort().reverse().map(k=>{const l=g[k],n=l.filter(x=>x.t==="a").length;return `<div class="wk">Semaine du ${new Date(k+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})} · ${n} crise${n>1?"s":""}</div>`+l.map(x=>x.t==="a"?item(x.o,1):itemP(x.o)).join("")}).join("")}
function hist(){
 const all=[...sorted().map(a=>({d:a.date,t:"a",o:a})),...S.pre.filter(p=>!p.att).map(p=>({d:p.date,t:"p",o:p}))].sort((a,b)=>b.d.localeCompare(a.d)),
  l=all.filter(x=>HF==="all"||x.t===HF),g={};l.forEach(x=>(g[x.d.slice(0,7)]=g[x.d.slice(0,7)]||[]).push(x));
 const keys=Object.keys(g).sort().reverse(),mname=k=>new Date(k+"-15T12:00").toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
 const html=keys.map((k,i)=>{const it=g[k],at=it.filter(x=>x.t==="a").map(x=>x.o),op=it.length-at.length,open=HOpen[k]!==undefined?HOpen[k]:i<2;
  return `<details class="mo" data-mo="${k}"${open?" open":""}><summary><span class="mn">${mname(k)}</span><span class="ms">${at.length} crise${at.length>1?"s":""}${at.length?" · moy. "+avg(at).toFixed(1)+"/10":""}${op?" · "+op+" pré-crise"+(op>1?"s":""):""}</span><span class="dots">${at.slice().reverse().slice(-16).map(a=>`<i style="background:${col(a.intensity)}"></i>`).join("")}</span></summary>${weeks(it)}</details>`}).join("");
 $("#v-hist").innerHTML=`<h3 style="margin-top:0">Historique${I("hist")}</h3><div class="chips" style="margin-bottom:12px">${[["all","Tout ("+all.length+")"],["a","Crises"],["p","Pré-crises"]].map(([v,t])=>`<button class="chip${HF===v?" on":""}" data-hf="${v}">${t}</button>`).join("")}</div>${html||`<div class="card"><div class="empty">Votre historique apparaîtra ici.</div></div>`}`;
 const V=$("#v-hist");
 V.querySelectorAll("[data-hf]").forEach(b=>b.onclick=()=>{HF=b.dataset.hf;hist()});
 V.querySelectorAll("details.mo").forEach(d=>d.ontoggle=()=>{HOpen[d.dataset.mo]=d.open});
 V.querySelectorAll("[data-da]").forEach(b=>b.onclick=()=>sure("Supprimer cette crise ?",()=>{const id=+b.dataset.da;S.attacks=S.attacks.filter(a=>a.id!==id);S.pre.forEach(p=>{if(p.att===id)p.att=null});save();render()}));
 V.querySelectorAll("[data-dp]").forEach(b=>b.onclick=()=>sure("Supprimer cette pré-crise ?",()=>{S.pre=S.pre.filter(p=>p.id!==+b.dataset.dp);save();render()}));
}
