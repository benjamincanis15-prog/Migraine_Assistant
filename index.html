<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Migraine Assistant</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#1d2733;--mu:#6b7785;--ln:#dde2e9;--ac:#4a5ba8;--ac2:#e5e9f7;--on:#fff;--sh:0 1px 2px rgba(20,30,50,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141a;--card:#1a1f29;--tx:#dfe4ec;--mu:#8d97a6;--ln:#2a313d;--ac:#8ea3ee;--ac2:#252c44;--on:#11141a;--sh:none}}
:root[data-theme="dark"]{--bg:#11141a;--card:#1a1f29;--tx:#dfe4ec;--mu:#8d97a6;--ln:#2a313d;--ac:#8ea3ee;--ac2:#252c44;--on:#11141a;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:0}
h3{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.sub{color:var(--mu);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:19px}
.i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ac2);color:var(--ac);font-size:13px;font-weight:700;font-style:italic;margin-left:6px;cursor:pointer;vertical-align:middle}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.big{width:100%;padding:24px 16px;border-radius:26px;background:var(--ac);color:var(--on);font-size:22px;font-weight:700;margin:6px 0 10px;box-shadow:0 8px 22px -8px var(--ac)}
.big small{display:block;font-size:14px;font-weight:500;opacity:.85}
.big.pre{padding:16px;font-size:18px;background:var(--ac2);color:var(--ac);box-shadow:none}
.rel{position:relative}.rel .i{position:absolute;top:10px;right:12px;margin:0;background:rgba(255,255,255,.28);color:inherit}
.row{display:flex;gap:10px}.row>*{flex:1}
.stat{text-align:center}.stat b{display:block;font-size:28px;line-height:1.1}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.item:first-of-type{border-top:0}
.dot{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;color:#10151c}
.item .t{flex:1;min-width:0}.item .t div:first-child{font-weight:600}
.item .t div+div{font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{color:var(--mu);font-size:18px;padding:6px 10px}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--ac);color:var(--on);font-weight:700;font-size:17px}
.btn.alt{background:var(--ac2);color:var(--ac)}.btn:disabled{opacity:.5}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--mu)}
nav button span{display:block;font-size:22px}nav button.on{color:var(--ac);font-weight:700}
.v{display:none}.v.on{display:block}
#ov,#tip{position:fixed;inset:0;background:rgba(5,8,14,.55);display:none;z-index:10;align-items:flex-end;justify-content:center}
#tip{z-index:20;align-items:center;padding:24px}
#ov.on,#tip.on{display:flex}
.tb{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;font-size:15px}
.tb .btn{margin-top:14px}
#sh{background:var(--bg);width:100%;max-width:520px;max-height:93%;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){#sh{animation:none}}
.gr{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--ln);font-size:15px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.chip.s2{border-color:#c9822b;color:#c9822b;background:rgba(201,130,43,.12)}.chip.s3{border-color:var(--mu);color:var(--mu)}
.ints{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.int{height:50px;border-radius:14px;font-size:19px;font-weight:700;color:#10151c;opacity:.45;border:3px solid transparent}
.int.on{opacity:1;border-color:var(--tx);transform:scale(1.05)}
input[type=datetime-local],input[type=text],input[type=number],input[type=date],textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--ln);border-radius:14px;padding:12px}
textarea{min-height:64px}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bar .n{width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:10px;background:var(--ac2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--ac)}.bar .p{width:34px;text-align:right;color:var(--mu)}
.fl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--ln);gap:8px}
.fl:first-child{border-top:0}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;border-radius:50%;background:var(--ac2);color:var(--ac);font-size:22px;font-weight:700}
.step b{min-width:70px;text-align:center}
.empty{color:var(--mu);text-align:center;padding:16px 6px}
.hint{color:#c0392b;font-size:14px;margin:8px 0 0;display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-top:1px solid var(--ln);text-align:right}td:first-child,th:first-child{text-align:left}th{font-weight:600;color:var(--mu)}
#aiout{white-space:pre-wrap;font-size:15px;margin-top:12px}
.sm{font-size:13px;color:var(--mu)}.rp td,.rp th{text-align:left;vertical-align:top;font-size:13px}.rp table{display:block;overflow-x:auto}.rp pre{white-space:pre-wrap;font:inherit;font-size:15px}
</style>
</head>
<body>
<div id="app">
<header><div><h1 style="font-size:21px;display:flex;align-items:center;gap:10px"><svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fa3ee"/><stop offset="1" stop-color="#4a5ba8"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><circle cx="28" cy="34" r="13" fill="#fff"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M43.4 20.6A19 19 0 0 1 43.4 47.4" opacity=".75"/><path d="M47.7 16.3A25 25 0 0 1 47.7 51.7" opacity=".45"/><path d="M51.2 12.8A30 30 0 0 1 51.2 55.2" opacity=".25"/></g></svg>Migraine Assistant</h1><div class="sub" id="dt"></div></div><div style="display:flex;gap:8px"><button class="ib" id="th" aria-label="Thème">🌓</button><button class="ib" id="ac" aria-label="Compte">👤</button><button class="ib" id="st" aria-label="Paramètres">⚙️</button></div></header>
<section class="v on" id="v-home"></section><section class="v" id="v-hist"></section><section class="v" id="v-stats"></section><section class="v" id="v-ana"></section>
</div>
<nav><div>
<button class="on" data-v="home"><span>🏠</span>Accueil</button><button data-v="hist"><span>📖</span>Historique</button><button data-v="stats"><span>📊</span>Stats</button><button data-v="ana"><span>🔬</span>Analyse</button>
</div></nav>
<div id="ov"><div id="sh"></div></div><div id="tip"></div>

<script>
const $=s=>document.querySelector(s);
const D={loc:["Côté gauche","Côté droit","Front","Nuque","Derrière l’œil","Tout le crâne"],sym:["Nausées","Photophobie (lumière)","Phonophobie (bruit)","Vertiges","Aura visuelle"],trg:["Manque de sommeil","Stress","Écrans","Météo / pression","Saut de repas","Caféine / alcool","Règles / hormones"],trt:["Triptan","Antalgique","Anti-inflammatoire","Repos dans le noir","Caféine","Froid / glace"],pre:["Bâillements","Fatigue inhabituelle","Irritabilité","Fringale","Soif","Raideur de nuque","Sensibilité lumière/bruit","Difficulté de concentration","Humeur basse","Vision floue / picotements"],pain:["Cervicales","Mâchoire (ATM)","Œil","Visage / face","Épaules"]};
const LBL={loc:"Localisation",sym:"Symptômes associés",trg:"Déclencheurs suspectés",trt:"Traitements pris",pre:"Symptômes de pré-crise",pain:"Douleurs associées"};
const PL=["","avant","après","incertain"],PW=["","avant la migraine","après / pendant la migraine","chronologie incertaine"];
const F=[["sleepH","Sommeil (h)",.5,0,14,7,"h","Durée de la nuit. Sur iPhone : app Santé > Sommeil (lecture automatique possible seulement dans la version native)."],["water","Eau bue",.25,0,6,0,"L","Litres bus sur cette période ; les périodes s’additionnent sur la journée (repère : 1,5 à 2 L/jour)."],["coffee","Cafés / thés",1,0,15,0,"","Nombre de boissons caféinées aujourd’hui. Un excès comme un sevrage peuvent jouer."],["alcohol","Verres d’alcool",1,0,15,0,"","Nombre de verres aujourd’hui."],["screens","Écrans (h)",.5,0,16,0,"h","Temps d’écrans sur cette période. Sur iPhone : Réglages > Temps d’écran (lecture automatique possible seulement dans la version native)."],["meals","Repas pris",1,0,6,0,"","Nombre de repas pris aujourd’hui. Sauter un repas est un déclencheur classique."],["activity","Activité physique",15,0,300,0,"min","Minutes d’activité physique aujourd’hui."]];
const C=[["sleepQ","Qualité du sommeil","1 = très mauvaise, 5 = excellente."],["stress","Stress","1 = serein, 5 = très stressé."],["mood","Humeur","1 = très basse, 5 = excellente."]];
const WE=["Stable","Chaud / lourd","Orageux","Froid","Pluie","Vent"];
const INFO={go:"Déclare une crise. Seule l’intensité est obligatoire : le reste est facultatif et peut être complété plus tard.",pre:"À utiliser dès les premiers signes (bâillements, nuque raide…) alors que la migraine n’est pas là. Ces signes seront automatiquement rattachés à la prochaine crise déclarée dans les 48 h.",jr:"Le journal collecte vos habitudes (sommeil, eau, stress…). Chaque saisie est horodatée avec précision. Vous pouvez en faire plusieurs par jour : c’est ce qui permet de repérer ce qui précède une crise.",hist:"Toutes vos crises, avec leurs signes de pré-crise rattachés. Touchez 🗑 pour supprimer.",stats:"Comptages simples : fréquence, intensité, éléments les plus souvent cochés.",ana:"Corrélations calculées sur votre appareil, puis analyse approfondie par IA sur demande.",when:"Date et heure de début. Par défaut : maintenant. Modifiable si vous déclarez après coup.",int:"Intensité de 1 (légère) à 10 (insupportable). Le vert correspond à une douleur faible, le rouge à une douleur forte.",loc:"Où la douleur est située. « Aucun » = aucune localisation précise ; « ＋ Autre » ajoute un élément mémorisé pour la prochaine fois.",sym:"Signes qui accompagnent la douleur. « Aucun » = aucun symptôme associé ; « ＋ Autre » ajoute un élément mémorisé.",pain:"Douleurs cervicales, mâchoire, œil, face… Touchez un élément pour choisir sa chronologie : « avant » (précède la migraine, possible déclencheur), « après » (conséquence), « incertain ». Touchez encore pour effacer. C’est ce qui permettra de savoir si ces douleurs causent la migraine ou en découlent.",trg:"Ce que vous soupçonnez d’avoir déclenché la crise. Cochez large : l’analyse départagera. « Aucun » = aucun déclencheur identifié.",trt:"Ce que vous avez pris ou fait pour soulager. « ＋ Autre » mémorise un nouveau traitement pour les prochaines fois.",lp:"Signes de pré-crise récents (48 h) non encore rattachés. Cochés = liés à cette crise ; décochez ceux qui n’ont aucun rapport.",note:"Texte libre : contexte, lieu, activité, évolution.",prep:"Symptômes ressentis AVANT la douleur. Les repérer permet d’anticiper et de traiter plus tôt. « Aucun » = rien de particulier.",ai:"Envoie vos données (sans votre nom) à Claude pour une analyse approfondie : déclencheurs probables, chronologie des douleurs, pistes de prévention. Aide à la réflexion, pas un diagnostic. L’envoi n’a lieu que lorsque vous touchez le bouton.",prof:"Âge, poids, taille, antécédents… ces éléments affinent l’analyse. Tout reste sur votre appareil.",lists:"Retirez (✕) ou ajoutez des éléments dans chaque questionnaire. Les ajouts faits dans une crise apparaissent aussi ici.",corr:"Compare vos moyennes dans les 24 h avant une crise avec celles des autres moments. Un écart marqué est une piste, pas une preuve.",chr:"Pour chaque zone douloureuse : combien de fois elle est apparue avant, après, ou avec chronologie incertaine par rapport à la migraine."};
const clone=o=>JSON.parse(JSON.stringify(o));
let S={attacks:[],pre:[],journal:[],profile:{},cfg:clone(D),theme:"auto",ai:null};
function load(){try{const r=JSON.parse(localStorage.getItem("migraine-v2")||localStorage.getItem("migraine-v1")||"null");if(r)Object.assign(S,r)}catch(e){}
 if(!Array.isArray(S.journal))S.journal=[];if(!Array.isArray(S.pre))S.pre=[];S.cfg=Object.assign(clone(D),S.cfg||{});S.attacks.forEach(a=>{a.pain=a.pain||{};a.pre=a.pre||[]})}
function save(){S.mod=Date.now();try{localStorage.setItem("migraine-v2",JSON.stringify(S))}catch(e){}if(typeof cloudDirty==="function")cloudDirty()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const I=k=>`<span class="i" data-i="${k}" role="button" aria-label="Information">i</span>`;
const col=n=>`hsl(${130-(n-1)*14},58%,${n>7?62:58}%)`;
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
const dayKey=d=>iso(new Date(d)).slice(0,10);
const fmt=d=>new Date(d).toLocaleString("fr-FR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const sorted=()=>[...S.attacks].sort((a,b)=>b.date.localeCompare(a.date));
const avg=l=>l.length?l.reduce((s,a)=>s+a.intensity,0)/l.length:0;
const mean=x=>x.length?Math.round(x.reduce((s,v)=>s+v,0)/x.length*100)/100:"–";
const real=a=>(a||[]).filter(x=>x!=="Aucun");

/* dialogues (pas de alert/prompt : bloqués en page publiée) */
function dlg(h){$("#tip").innerHTML=`<div class="tb">${h}</div>`;$("#tip").classList.add("on")}
const shut=()=>$("#tip").classList.remove("on");
$("#tip").onclick=e=>{if(e.target.id==="tip")shut()};
function tip(k){dlg(INFO[k]||"");$(".tb").insertAdjacentHTML("beforeend",`<button class="btn alt" id="ok">Compris</button>`);$("#ok").onclick=shut}
function ask(t,cb){dlg(`<b>${t}</b><input type="text" id="ai1" style="margin:10px 0"><button class="btn" id="ok">Ajouter</button>`);const i=$("#ai1");i.focus();const go=()=>{const v=i.value.trim();shut();if(v)cb(v)};$("#ok").onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()}}
function sure(t,cb){dlg(`<b>${t}</b><div class="row" style="margin-top:12px"><button class="btn alt" id="no">Annuler</button><button class="btn" id="ok">Confirmer</button></div>`);$("#no").onclick=shut;$("#ok").onclick=()=>{shut();cb()}}
document.addEventListener("click",e=>{const i=e.target.closest(".i");if(i){e.stopPropagation();e.preventDefault();tip(i.dataset.i)}},true);

function applyTheme(){const r=document.documentElement;S.theme==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.theme);$("#th").textContent={auto:"🌓",light:"☀️",dark:"🌙"}[S.theme]}
$("#th").onclick=()=>{S.theme={auto:"light",light:"dark",dark:"auto"}[S.theme];save();applyTheme()};
$("#st").onclick=()=>settings();

/* ---------- vues ---------- */
const linked=a=>S.pre.filter(p=>p.att===a.id);
function item(a,del){const n=linked(a).length;return `<div class="item" data-oa="${a.id}"><div class="dot" style="background:${col(a.intensity)}">${a.intensity}</div><div class="t"><div>${fmt(a.date)}${n?` 🌀${n}`:""}${a.end?` ✓ ${Math.round((new Date(a.end)-new Date(a.date))/6e4)} min`:""}</div><div>${esc([...real(a.loc),...real(a.sym),...real(a.trt)].join(", ")||"Aucun détail")}</div></div>${del?`<button class="del" data-da="${a.id}" aria-label="Supprimer">🗑</button>`:""}</div>`}
function itemP(p){return `<div class="item" data-op="${p.id}"><div class="dot" style="background:var(--ac2)">🌀</div><div class="t"><div>${fmt(p.date)} · pré-crise</div><div>${esc(real(p.sym).join(", ")||"Aucun détail")}</div></div><button class="del" data-dp="${p.id}" aria-label="Supprimer">🗑</button></div>`}
function hist(){
 const l=[...sorted().map(a=>({d:a.date,h:item(a,1)})),...S.pre.filter(p=>!p.att).map(p=>({d:p.date,h:itemP(p)}))].sort((a,b)=>b.d.localeCompare(a.d));
 $("#v-hist").innerHTML=`<h3 style="margin-top:0">Historique${I("hist")}</h3><div class="card">${l.length?l.map(x=>x.h).join(""):`<div class="empty">Votre historique apparaîtra ici.</div>`}</div>`;
 $("#v-hist").querySelectorAll("[data-da]").forEach(b=>b.onclick=()=>sure("Supprimer cette crise ?",()=>{const id=+b.dataset.da;S.attacks=S.attacks.filter(a=>a.id!==id);S.pre.forEach(p=>{if(p.att===id)p.att=null});save();render()}));
 $("#v-hist").querySelectorAll("[data-dp]").forEach(b=>b.onclick=()=>sure("Supprimer cette pré-crise ?",()=>{S.pre=S.pre.filter(p=>p.id!==+b.dataset.dp);save();render()}));
}
function tally(list,key){const c={};list.forEach(a=>real(a[key]).forEach(x=>c[x]=(c[x]||0)+1));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6)}
const bars=(rows,n)=>rows.length?rows.map(([k,v])=>`<div class="bar"><span class="n">${esc(k)}</span><span class="tr"><i style="width:${v/n*100}%"></i></span><span class="p">${Math.round(v/n*100)}%</span></div>`).join(""):`<div class="empty">Pas encore de données.</div>`;
function painTally(){const c={},add=(o,f)=>Object.entries(o||{}).forEach(([z,s])=>{if(z==="Aucun")return;(c[z]=c[z]||[0,0,0,0])[f||s]++});S.attacks.forEach(a=>add(a.pain));S.pre.forEach(p=>add(p.pain,1));return c}
function stats(){
 const n=S.attacks.length,m=S.attacks.filter(a=>a.date.startsWith(iso(new Date()).slice(0,7))),pt=painTally();
 $("#v-stats").innerHTML=`<div class="row"><div class="card stat"><b>${m.length}</b><span class="sub">ce mois-ci</span></div><div class="card stat"><b>${n}</b><span class="sub">au total</span></div><div class="card stat"><b>${n?avg(S.attacks).toFixed(1):"–"}</b><span class="sub">intensité moy.</span></div></div>
 <h3>Déclencheurs fréquents${I("trg")}</h3><div class="card">${bars(tally(S.attacks,"trg"),n)}</div>
 <h3>Symptômes fréquents${I("sym")}</h3><div class="card">${bars(tally(S.attacks,"sym"),n)}</div>
 <h3>Signes de pré-crise${I("prep")}</h3><div class="card">${bars(tally(S.pre,"sym"),S.pre.length)}</div>
 <h3>Traitements utilisés${I("trt")}</h3><div class="card">${bars(tally(S.attacks,"trt"),n)}</div>
 <h3>Douleurs associées : chronologie${I("chr")}</h3><div class="card">${Object.keys(pt).length?Object.entries(pt).map(([z,c])=>`<div class="fl"><b>${esc(z)}</b><span class="sm">avant ${c[1]} · après ${c[2]} · incertain ${c[3]}</span></div>`).join(""):`<div class="empty">Pas encore de données.</div>`}</div>`;
}
const NUM=[...F.map(f=>[f[0],f[1]]),...C.map(c=>[c[0],c[1]])];
function corr(){
 const A=S.attacks.map(a=>+new Date(a.date)),pre=j=>{const t=+new Date(j.ts);return A.some(a=>a-t>0&&a-t<864e5)};
 const rows=NUM.map(([k,l])=>{const x=S.journal.filter(j=>pre(j)&&j[k]!=null).map(j=>j[k]),y=S.journal.filter(j=>!pre(j)&&j[k]!=null).map(j=>j[k]);return x.length<2||y.length<2?"":`<tr><td>${l}</td><td>${mean(x)}</td><td>${mean(y)}</td></tr>`}).join("");
 return rows?`<table><tr><th></th><th>24 h avant crise</th><th>autres moments</th></tr>${rows}</table>`:`<div class="empty">Faites plusieurs saisies de journal (dont certaines avant des crises) pour voir apparaître des comparaisons.</div>`;
}
function render(){home();hist();stats();ana();$("#v-stats").insertAdjacentHTML("afterbegin",todayCard());$("#dt").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}

async function token(){if(!CL.uid)throw{code:"SESSION_EXPIRED"};if(Date.now()<CL.exp-6e4)return CL.tk;let r;
 try{r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${fbc().apiKey}`,{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(CL.rt)})}catch(e){throw{code:"NETWORK"}}
 const d=await r.json();if(!r.ok){CL.uid=null;CL.tk=null;clSave();badge();throw{code:"SESSION_EXPIRED"}}CL.tk=d.id_token;CL.rt=d.refresh_token;CL.exp=Date.now()+(+d.expires_in)*1e3;clSave();return CL.tk}
const docUrl=()=>`https://firestore.googleapis.com/v1/projects/${fbc().projectId}/databases/(default)/documents/users/${CL.uid}`;
async function cloudGet(){const tk=await token();let r;try{r=await fetch(docUrl(),{headers:{authorization:"Bearer "+tk}})}catch(e){throw{code:"NETWORK"}}
 if(r.status===404)return null;const d=await r.json();if(!r.ok)throw{code:(d.error&&d.error.status)||r.status};const f=d.fields||{};
 return{data:JSON.parse((f.data&&f.data.stringValue)||"{}"),upd:+((f.upd&&f.upd.integerValue)||0)}}
async function cloudPut(){const tk=await token(),upd=Date.now();S.owner=CL.uid;rawSave();const snap=clone(S);delete snap.theme;if(snap.profile)delete snap.profile.apiKey;
 const s=JSON.stringify(snap);if(s.length>9e5)throw{code:"TOO_BIG"};let r;
 try{r=await fetch(docUrl()+"?updateMask.fieldPaths=data&updateMask.fieldPaths=upd",{method:"PATCH",headers:{authorization:"Bearer "+tk,"content-type":"application/json"},body:JSON.stringify({fields:{data:{stringValue:s},upd:{integerValue:String(upd)}}})})}catch(e){throw{code:"NETWORK"}}
 if(!r.ok){const d=await r.json().catch(()=>({}));throw{code:(d.error&&d.error.status)||r.status}}
 CL.last=upd;CL.at=upd;CL.dirty=false;CL.err=null;clSave();badge()}
const hasData=()=>S.attacks.length||S.pre.length||S.journal.length;
function adopt(d){const th=S.theme;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,{attacks:[],pre:[],journal:[],profile:{},cfg:clone(D),ai:null},d||{});S.theme=th;
 ["attacks","pre","journal"].forEach(g=>{if(!Array.isArray(S[g]))S[g]=[]});S.profile=S.profile||{};S.cfg=Object.assign(clone(D),S.cfg||{});S.attacks.forEach(a=>{a.pain=a.pain||{};a.pre=a.pre||[]});S.owner=CL.uid;rawSave()}
function merge(a,b){const o=clone(b);["attacks","pre","journal"].forEach(g=>{const ids=new Set((a[g]||[]).map(x=>x.id));o[g]=[...(a[g]||[]),...(b[g]||[]).filter(x=>!ids.has(x.id))]});
 o.profile=Object.assign({},b.profile,a.profile);o.cfg=Object.assign({},b.cfg||{},a.cfg||{});Object.keys(o.cfg).forEach(g=>{if(Array.isArray(o.cfg[g]))o.cfg[g]=[...new Set([...((a.cfg||{})[g]||[]),...((b.cfg||{})[g]||[])])]});
 o.per=a.per!=null?a.per:b.per;o.ai=a.ai||b.ai;return o}
let syncing=false,tmr=null;
function badge(){const b=$("#ac");if(b)b.textContent=CL.uid?(CL.err?"⚠️":CL.dirty?"🔄":"☁️"):"👤"}
function cloudDirty(){if(!CL.uid||!fbOK())return;CL.dirty=true;clSave();badge();clearTimeout(tmr);tmr=setTimeout(()=>cloudSync(true),2500)}
async function cloudSync(quiet){if(!CL.uid||!fbOK()||syncing)return;syncing=true;let pulled=false;
 try{const rem=await cloudGet();
  if(!rem)await cloudPut();
  else if(rem.upd!==CL.last){if(CL.dirty){adopt(merge(S,rem.data));pulled=true;await cloudPut()}else{adopt(rem.data);CL.last=rem.upd;CL.at=Date.now();clSave();pulled=true}}
  else if(CL.dirty)await cloudPut();
  else{CL.at=Date.now();clSave()}
  CL.err=null}catch(e){CL.err=errMsg(e.code);clSave()}
 syncing=false;badge();if(pulled&&!$("#ov").classList.contains("on"))render()}
async function firstSync(fresh){let rem=null;
 try{rem=fresh?null:await cloudGet()}catch(e){CL.err=errMsg(e.code);clSave();account();return}
 if(S.owner&&S.owner!==CL.uid)adopt(null);
 const done=()=>{shut();badge();render();account()},fail=e=>{CL.err=errMsg(e.code);CL.dirty=true;clSave();done()};
 if(!rem){try{await cloudPut();done()}catch(e){fail(e)}return}
 if(!hasData()){adopt(rem.data);CL.last=rem.upd;CL.at=Date.now();clSave();done();return}
 dlg(`<b>Des données existent sur cet appareil et dans votre compte.</b><div class="sm" style="margin-top:6px">Que voulez-vous garder ?</div><button class="btn" id="c1">☁️ Celles du compte</button><button class="btn alt" id="c2">🔀 Fusionner les deux</button><button class="btn alt" id="c3">📱 Celles de cet appareil (remplace le compte)</button>`);
 $("#c1").onclick=()=>{adopt(rem.data);CL.last=rem.upd;CL.at=Date.now();clSave();done()};
 $("#c2").onclick=async()=>{try{adopt(merge(S,rem.data));await cloudPut();done()}catch(e){fail(e)}};
 $("#c3").onclick=async()=>{try{await cloudPut();done()}catch(e){fail(e)}}}
async function doAuth(kind){const id=cleanId($("#ci").value),pw=$("#cp").value,m=$("#cm");
 if(id.length<3){m.textContent="Identifiant : 3 caractères minimum (lettres, chiffres, point, tiret).";return}
 if(pw.length<6){m.textContent="Mot de passe : 6 caractères minimum.";return}
 m.textContent="Connexion…";
 try{const d=await fbAuth(kind==="up"?"signUp":"signInWithPassword",id,pw),same=CL.uid===d.localId||(!CL.uid&&CL.id===id&&S.owner===d.localId);
  CL={apiKey:CL.apiKey,projectId:CL.projectId,id,uid:d.localId,tk:d.idToken,rt:d.refreshToken,exp:Date.now()+(+d.expiresIn)*1e3,last:same?CL.last:undefined,dirty:same?CL.dirty:false};clSave();
  if(same){shut();await cloudSync(true);badge();render();account()}else await firstSync(kind==="up")}
 catch(e){m.textContent=errMsg(e.code)}}
function logout(){dlg(`<b>Se déconnecter ?</b><div class="sm" style="margin-top:6px">Vos données restent dans votre compte. Que faire de celles de cet appareil ?<br>(Si vous vous connectez ensuite avec un autre compte, elles seront remplacées.)</div><button class="btn" id="l1">Les garder ici</button><button class="btn alt" id="l2">Les effacer (appareil partagé)</button><button class="btn alt" id="l3">Annuler</button><div class="sm" id="lm" style="margin-top:8px"></div>`);
 $("#l3").onclick=shut;
 $("#l1").onclick=()=>{CL={apiKey:CL.apiKey,projectId:CL.projectId,id:CL.id,last:CL.last,dirty:CL.dirty};clSave();shut();badge();account()};
 $("#l2").onclick=async()=>{if(CL.dirty){try{await cloudPut()}catch(e){$("#lm").textContent="Synchronisation impossible ("+errMsg(e.code)+") : données conservées.";return}}
  CL={apiKey:CL.apiKey,projectId:CL.projectId,id:CL.id};clSave();adopt(null);delete S.owner;rawSave();shut();badge();render();account()}}
const RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /users/{uid} {\n      allow read, write: if request.auth != null && request.auth.uid == uid;\n    }\n  }\n}";
function account(){
 if(!fbOK()){
  sheet(`<div class="sh-h"><h2>Compte et cloud</h2><button class="ib" id="x">✕</button></div><div class="card"><b>Activer la synchronisation (gratuit)</b><ol class="sm" style="padding-left:18px;margin:8px 0"><li>console.firebase.google.com → Ajouter un projet (Analytics non nécessaire).</li><li>Authentication → Commencer → « E-mail/Mot de passe » → activer.</li><li>Firestore Database → Créer (mode production) → onglet Règles → collez les règles ci-dessous → Publier.</li><li>Paramètres du projet ⚙ → Général : copiez « Clé API Web » et « ID du projet ».</li></ol><button class="btn alt" id="cr">Copier les règles Firestore</button><h3>Clé API Web</h3><input id="fk" type="text" autocapitalize="none" placeholder="AIza…"><h3>ID du projet</h3><input id="fp" type="text" autocapitalize="none" placeholder="mon-projet-1234"><button class="btn" id="fs" style="margin-top:12px">Enregistrer</button><div class="sm" id="cm" style="margin-top:8px"></div></div>`);
  $("#x").onclick=close;$("#cr").onclick=()=>{try{navigator.clipboard.writeText(RULES);$("#cr").textContent="Copié ✓"}catch(e){}};
  $("#fs").onclick=()=>{const k=$("#fk").value.trim(),p=$("#fp").value.trim();if(!k||!p){$("#cm").textContent="Renseignez les deux champs.";return}CL.apiKey=k;CL.projectId=p;clSave();account()};return}
 if(CL.uid){
  sheet(`<div class="sh-h"><h2>Compte et cloud</h2><button class="ib" id="x">✕</button></div><div class="card"><b>☁️ Connecté : ${esc(CL.id||"")}</b><div class="sm" id="cst" style="margin-top:6px">${CL.err?"⚠️ "+esc(CL.err)+"<br>":""}${CL.dirty?"Modifications en attente d’envoi.":"Tout est synchronisé."}${CL.at?"<br>Dernière vérification : "+fmt(CL.at):""}</div><button class="btn" id="sn" style="margin-top:12px">🔄 Synchroniser maintenant</button><button class="btn alt" id="lo" style="margin-top:10px">Se déconnecter</button></div><p class="sm">Vos données sont enregistrées sur l’offre gratuite Google Firebase, accessibles uniquement avec votre identifiant et mot de passe. Sur un autre appareil : ouvrez la même app et connectez-vous. Sans adresse e-mail, un mot de passe perdu ne peut pas être récupéré.</p>`);
  $("#x").onclick=close;$("#lo").onclick=logout;$("#sn").onclick=async()=>{$("#sn").disabled=true;$("#sn").textContent="Synchronisation…";await cloudSync(false);account()};return}
 sheet(`<div class="sh-h"><h2>Compte et cloud</h2><button class="ib" id="x">✕</button></div><div class="card"><b>Retrouvez vos données sur tous vos appareils</b><h3>Identifiant</h3><input id="ci" type="text" autocapitalize="none" autocomplete="username" placeholder="ex. camille75" value="${esc(CL.id||"")}"><h3>Mot de passe</h3><input id="cp" type="password" autocomplete="current-password" placeholder="6 caractères minimum"><button class="btn" id="in" style="margin-top:12px">Se connecter</button><button class="btn alt" id="up" style="margin-top:10px">Créer mon compte</button><div class="sm" id="cm" style="margin-top:8px">${CL.err?"⚠️ "+esc(CL.err):""}</div></div><p class="sm">Pas d’e-mail demandé : choisissez un identifiant (lettres, chiffres, point, tiret) et un mot de passe que vous retiendrez, il ne pourra pas être récupéré.</p>`);
 $("#x").onclick=close;$("#in").onclick=()=>doAuth("in");$("#up").onclick=()=>doAuth("up")}
$("#ac").onclick=account;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)cloudSync(true)});window.addEventListener("online",()=>cloudSync(true));

load();applyTheme();render();badge();cloudSync(true);
</script>
</body>
